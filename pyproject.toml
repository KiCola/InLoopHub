[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inloop"
version = "0.1.0"
description = "InLoop 手记内容仓库与微信公众号发布系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Zero Zhao" }]
keywords = ["markdown", "wechat", "publishing", "content-as-code"]

# 依赖清单见任务书 §21
dependencies = [
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "beautifulsoup4>=4.12",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "Typer>=0.12",
    "Rich>=13.0",
]

[project.optional-dependencies]
# 任务书 §21 的可选依赖
dev = [
    "Pygments>=2.17",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
inloop = "inloop.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
