[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inloop"
version = "0.1.0"
description = "InLoop 手记内容仓库与微信公众号发布系统"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zero Zhao" }]
keywords = ["markdown", "wechat", "publishing", "content-as-code"]

# 依赖清单见任务书 §21
dependencies = [
    "PyYAML>=6.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "beautifulsoup4>=4.12",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "Typer>=0.12",
    "Rich>=13.0",
]

[project.optional-dependencies]
# 任务书 §21 的可选依赖
dev = [
    "Pygments>=2.17",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
# 指向 _run 而不是 app：_run 里有一层兜底异常处理，
# 把未预期的异常转成结构化 JSON 错误而不是裸 traceback。
# 调用方（编辑器插件）依赖 stdout 上的 JSON，traceback 会让它无法解析。
inloop = "inloop.cli:_run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# 显式指定临时目录的根，不用系统临时目录。
# 原因：本机环境中 tempfile.gettempdir() 会回退到当前工作目录，
# 于是 pytest 的 tmp_path 会在仓库根创建 pytest-of-<用户>/，污染工作区。
# 指定到工作区内的固定路径后，位置确定、可被 .gitignore 覆盖、也便于排查。
addopts = "--basetemp=.pytest_tmp"
